services:
  nuvio-companion:
    build: .
    container_name: nuvio-companion
    restart: unless-stopped
    network_mode: host
    environment:
      NUVIO_SERVER_CONFIG: /etc/nuvio/server.toml
      RUST_LOG: info
      # NUVIO_SERVER_TOKEN: set-outside-this-file
    volumes:
      - ./server.toml:/etc/nuvio/server.toml:ro
      - nuvio-cache:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  nuvio-cache:

[package]
name = "nuvio-companion"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Private server-side acceleration for NuvioTV"

[dependencies]
axum = "0.8.4"
if-addrs = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9.5"
tower-http = { version = "0.6.6", features = ["limit", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
